[package]
name = "syn-wasm"
description = "The core's JavaScript interface: one wasm-bindgen surface for the web app (its AudioWorklet, its Web Workers, the points Worker)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "syn_wasm"
# cdylib is the .wasm the web app loads; rlib lets the host tests link it.
crate-type = ["cdylib", "rlib"]

[dependencies]
syn-core = { path = "../syn-core" }
syn-player = { path = "../syn-player" }
serde_json = "1"
wasm-bindgen = "=0.2.129"

[dev-dependencies]
wasm-bindgen-test = "0.3"

# Not `[lints] workspace = true`: like syn-ffi's scaffolding, the exports
# wasm-bindgen generates are `#[no_mangle]`, which `unsafe_code` counts as
# unsafe. This crate itself writes no unsafe block.
