[package]
name = "syn-ffi"
description = "The core's foreign interface: one UniFFI surface for the Kotlin (Android) and Swift (iOS) apps."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "syn_ffi"
# A plain library on purpose: each app links it into its own native library
# (Android: a cdylib, `syn-android`; iOS: a staticlib), and the bindings are
# generated from that. A cdylib here would be built a second time inside
# every app and shipped next to the real one.
crate-type = ["lib"]

[features]
# The bindings generator, for an app's own `uniffi-bindgen` binary: it calls
# `syn_ffi::uniffi_bindgen_main`, so the generator is always the same UniFFI
# as the scaffolding it reads.
cli = ["uniffi/cli"]

[dependencies]
syn-core = { path = "../syn-core" }
syn-player = { path = "../syn-player" }
syn-session = { path = "../syn-session" }
thiserror = "2"
uniffi = "=0.32.2"
serde_json = "1"
