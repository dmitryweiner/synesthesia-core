[package]
name = "syn-session"
description = "The control logic every app shares: the explorer, the morph, the scout's scheduling, the status line."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
syn-core = { path = "../syn-core" }
rayon = "1"
# The points file is the web app's JSON, read and written here so that every
# app's file is the same file (synesthesia-android PLAN.md, decision 7).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
